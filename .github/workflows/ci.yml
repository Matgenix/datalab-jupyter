name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.11.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.environment }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        environment: ["plugin", "jupyter"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - if: matrix.environment == 'plugin'
        run: uv sync --locked --extra plugin --group plugin-dev --dev
      - if: matrix.environment == 'plugin'
        run: uv run pytest tests/test_provider.py -v
      - if: matrix.environment == 'jupyter'
        run: uv sync --locked --extra hub --extra server --dev
      - if: matrix.environment == 'jupyter'
        run: uv run pytest -v
      - run: uv build

  handoff-integration:
    name: Datalab handoff integration
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.20-noble
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: Matgenix/datalab
          ref: c0d1486d6055406a20d8634431c3400e35fd1505
          path: datalab-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra hub --group plugin-dev --dev
      - name: Use the reviewed Datalab core revision
        run: uv pip install --python .venv/bin/python --no-deps --editable datalab-core/pydatalab
      - name: Run the cross-repository handoff regression
        env:
          DATALAB_CROSS_REPOSITORY_TEST: "1"
        run: >-
          uv run --no-sync pytest
          tests/test_datalab_handoff_integration.py -v

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
