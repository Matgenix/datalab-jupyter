[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8.1,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-jupyter"
dynamic = ["version"]
description = "Datalab tool integration for JupyterHub and Jupyter user servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "datalab development team", email = "dev@datalab-org.io" }]
dependencies = []

[project.optional-dependencies]
plugin = []
hub = ["httpx>=0.28,<0.29", "jupyterhub>=5.5,<6"]
server = [
    "datalab-api>=0.5,<0.6",
    "httpx>=0.28,<0.29",
    "jupyterhub>=5.5,<6",
    "jupyter-server>=2.17,<3",
    "nbformat>=5.10,<6",
]

[project.entry-points."pydatalab.tools"]
jupyter = "datalab_jupyter.plugin.provider:JupyterToolProvider"

[project.entry-points."jupyterhub.authenticators"]
datalab = "datalab_jupyter.hub.authenticator:DatalabAuthenticator"

[project.scripts]
datalab-jupyter-healthcheck = "datalab_jupyter.healthcheck:main"
datalab-jupyter-singleuser = "datalab_jupyter.kernel.bootstrap:singleuser_main"

[project.urls]
Repository = "https://github.com/Matgenix/datalab-jupyter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datalab_jupyter = ["py.typed", "resources/*.html", "resources/*.py"]

[tool.setuptools.data-files]
"etc/jupyter/jupyter_server_config.d" = [
    "jupyter-config/jupyter_server_config.d/datalab_jupyter.json",
]

[tool.setuptools_scm]
fallback_version = "0.1.0"
version_scheme = "post-release"

[tool.uv.sources]
datalab-server = { git = "https://github.com/Matgenix/datalab.git", branch = "dw/analysis_tools", subdirectory = "pydatalab" }

[tool.uv]
conflicts = [
    [{ group = "plugin-dev" }, { extra = "hub" }],
    [{ group = "plugin-dev" }, { extra = "server" }],
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
]
plugin-dev = ["datalab-server[server]"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "W"]
